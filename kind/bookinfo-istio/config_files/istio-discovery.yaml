# Istio Discovery Service Configuration
# This would typically be installed via: istioctl install --set values.defaultRevision=default
# For this example, we're referencing what would be applied

apiVersion: v1
kind: ConfigMap
metadata:
  name: istio
  namespace: istio-system
  labels:
    istio.io/rev: default
data:
  mesh: |
    defaultConfig:
      meshId: mesh1
      trustDomain: cluster.local
    trustDomainAliases:
    - cluster.local
---
# Note: In a real deployment, this would include the full Istio discovery service
# For this example, we assume Istio istiod is installed via:
# kubectl apply -f https://github.com/istio/istio/releases/download/1.20.1/istio-discovery.yaml