# Istio Base Configuration
# This would typically be installed via: istioctl install --set values.defaultRevision=default
# For this example, we include the essential CRDs and configurations

apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    istio-injection: disabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-reader-service-account
  namespace: istio-system
  labels:
    app: istio-reader
    release: istio
---
# Note: In a real deployment, this would include all Istio CRDs and base components
# For this example, we're focusing on the application configuration
# Assume Istio is pre-installed via: kubectl apply -f https://github.com/istio/istio/releases/download/1.20.1/istio-base.yaml