apiVersion: networking.kubeslice.io/v1beta1
kind: ServiceExport
metadata:
  name: details
  namespace: bookinfo
spec:
  slice: bookinfo-slice
  selector:
    matchLabels:
      app: details
  ports:
  - name: http
    protocol: TCP
    containerPort: 9080
---
apiVersion: networking.kubeslice.io/v1beta1
