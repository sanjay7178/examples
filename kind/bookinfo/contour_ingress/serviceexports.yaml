  namespace: bookinfo
spec:
  slice: bookinfo-slice
  selector:
    matchLabels:
      app: reviews
  ports:
  - name: http
    protocol: TCP
    containerPort: 9080
---
apiVersion: networking.kubeslice.io/v1beta1
